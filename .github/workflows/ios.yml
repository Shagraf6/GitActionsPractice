name: iOS Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the app
        run: |
          xcodebuild \
            -project TestingGithubActions.xcodeproj \
            -scheme TestingGithubActions \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build

      - name: Run tests
        run: |
          xcodebuild \
            -project TestingGithubActions.xcodeproj \
            -scheme TestingGithubActions \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            test